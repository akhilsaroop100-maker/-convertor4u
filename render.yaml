services:
  - type: web
    name: convertor4u
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_units
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,convertor4u.com,www.convertor4u.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://convertor4u.com,https://www.convertor4u.com
      - key: SITE_URL
        value: https://convertor4u.com
      - key: SECURE_SSL_REDIRECT
        value: true
      - key: DATABASE_URL
        fromDatabase: {name: convertor4u-db, property: connectionString}
  - type: cron
    name: convertor4u-currency-refresh
    runtime: python
    schedule: "15 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py refresh_currency_rates
    envVars:
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase: {name: convertor4u-db, property: connectionString}
databases:
  - name: convertor4u-db
    plan: free
